# What counts as a match. All patterns are case-insensitive regular expressions.

# Keywords sent to career sites that support search (Workday, SmartRecruiters, etc.).
search_terms:
  - power bi
  - data engineer
  - data analyst
  - microsoft fabric
  - azure data
  - analytics

# A job title must match at least one of these...
title_include:
  - power ?bi
  - business intelligence
  - \bbi\b
  - data engineer
  - data analyst
  - analytics engineer
  - data operations
  - fabric
  - azure data
  - databricks
  - pyspark
  - snowflake
  - sql developer
  - \betl\b
  - reporting
  - analytics
  - ai engineer

# ...and none of these (seniority the candidate does not have yet).
title_exclude:
  - senior
  - \bsr\.?\b
  - lead
  - principal
  - manager
  - managing
  - director
  - architect
  - head
  - staff
  - \bvp\b
  - expert
  - intern
  - returnship

# Location must match one of these (Chennai, Bengaluru, Hyderabad only).
# "Multiple locations" postings (common at Deloitte USI) usually include these cities.
locations:
  - chennai
  - bengaluru
  - bangalore
  - hyderabad
  - multiple locations

# Skip postings whose stated minimum experience is above this (unstated is kept).
max_min_years: 3

# Roles asking for a bit more (4-5 years) are kept only when Gemini scores the fit this high.
stretch_max_years: 5
stretch_min_score: 75

# Gemini fit score (only runs when the GEMINI_API_KEY secret is set).
gemini_model: gemini-flash-lite-latest   # Flash-Lite has a higher free quota; falls back to Flash
min_fit_score: 40                        # hide jobs Gemini rates below this (unscored jobs are kept)
max_scored_per_run: 40
gemini_delay_seconds: 4
# Used for LLM scoring only when the CANDIDATE_SUMMARY secret is not set.
# Put your real profile in that secret so it is not public.
candidate_summary: >
  Early-career data professional (0 to 3 years) with SQL, Power BI and Python,
  looking for data analyst, BI developer and data engineer roles.
