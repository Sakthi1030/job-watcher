name: Daily job watch

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST every day
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send the email even if there are no new jobs"
        type: boolean
        default: false
      resend_all:
        description: "Email every current match, including ones already reported"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check career sites
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_SUMMARY: ${{ secrets.CANDIDATE_SUMMARY }}
        run: python -m job_watcher ${{ inputs.test_email && '--test-email' || '' }} ${{ inputs.resend_all && '--resend-all' || '' }}

      - name: Save state and report
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "job-watcher-bot@users.noreply.github.com"
          git add data/seen.json reports/
          git diff --cached --quiet || git commit -m "Job watch $(date -u +%Y-%m-%d)"
          git push
